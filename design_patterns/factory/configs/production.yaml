# Production model configuration
# This is the model that gets deployed after experimentation

model:
  algorithm: xgboost
  hyperparameters:
    n_estimators: 200
    max_depth: 6
    learning_rate: 0.05
    subsample: 0.8
    colsample_bytree: 0.8

training:
  test_size: 0.2
  cv_folds: 5
  scoring_metric: f1_weighted

data:
  source: s3://data-lake/features/latest.parquet
  target_column: churn
  feature_columns:
    - age
    - tenure_days
    - monthly_spend
    - support_tickets
    - login_frequency
